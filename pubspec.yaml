name: quick_ledger
description: 快記帳 Flutter Web 互動原型
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.2.0
  go_router: ^14.8.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.16.0
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - web/kgz_ocr.js
    - web/icons/icon-192.png
    - web/ppocr/
    - web/tesseract/
    - web/tesseract/core/
    - web/tesseract/lang/
