apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: quick-ledger-ocr
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: OCR_WORKER_IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: OCR_WORKER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: quick-ledger-ocr-hmac
                  key: latest
